name: Deploy to Firebase

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Functions dependencies
      run: |
        cd functions
        npm ci

    - name: Create environment file
      run: |
        echo "REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }}" >> .env
        echo "REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}" >> .env
        echo "REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}" >> .env
        echo "REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}" >> .env
        echo "REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
        echo "REACT_APP_FIREBASE_APP_ID=${{ secrets.REACT_APP_FIREBASE_APP_ID }}" >> .env
        echo "REACT_APP_BREVO_API_KEY=${{ secrets.REACT_APP_BREVO_API_KEY }}" >> .env

    - name: Build React app
      run: npm run build

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Deploy to Firebase
      run: |
        # Create a temporary file for the service account key
        echo "${{ secrets.GCP_SA_KEY }}" > /tmp/gcp_sa_key.json
        # Set the GOOGLE_APPLICATION_CREDENTIALS environment variable to point to the file
        export GOOGLE_APPLICATION_CREDENTIALS="/tmp/gcp_sa_key.json"
        # Deploy using Firebase CLI
        firebase deploy
      env:
        # The GOOGLE_APPLICATION_CREDENTIALS environment variable is now set within the run block
        # Do NOT include it here directly if you are setting it via 'export' in the 'run' script
        # This block is kept for clarity, but the actual setting happens above.
        # If you were to set it here, it would be: GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        # But the file-based approach is more reliable for complex JSON.
        # No need for FIREBASE_TOKEN when using GOOGLE_APPLICATION_CREDENTIALS
        SKIP_FIREBASE_INIT: "true" # Optional: Can help prevent redundant firebase init prompts
